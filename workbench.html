<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交易终端 · IBKR</title><link rel="stylesheet" href="workbench_v2.css"></head><body><main>
<header class="top"><div><span class="logo">IBKR//RO</span><h1>交易终端</h1><div class="sub"><span id="runnerStatus">—</span><span id="phase">阶段：—</span><span id="clock">—</span></div></div><div class="headline"><div><small>账户净值</small><b id="nav">—</b></div><div><small>账户当日盈亏（IB）</small><b id="today">—</b></div><div><small>账户本周</small><b id="week">—</b></div><div><small>策略交易 / 胜负</small><b id="stats">—</b></div></div></header><div id="stale" class="stale" hidden>数据可能过期</div>
<section class="grid"><aside><section class="panel"><h2>团队角色</h2><div id="roles" class="roles"></div></section><section class="panel"><h2>数据状态</h2><p class="muted">最后更新：<span id="updated">—</span></p><p class="muted">北京 / 美东：<span id="tz">—</span></p></section></aside>
<section class="center"><section class="panel"><h2>流水线</h2><div id="pipeline" class="pipeline"></div><div id="counts" class="counts"></div></section><section class="panel"><h2>硬规则</h2><div id="rules" class="rules"></div></section><section class="panel"><h2>今晚统计</h2><div id="tonight"></div><div id="cards" class="card-list"></div></section></section>
<aside><section class="panel"><h2>评分仪表盘</h2><div class="score"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" class="track"></circle><circle id="scoreArc" cx="60" cy="60" r="48" class="arc"></circle></svg><b id="score">—</b></div><div id="scoreItems" class="score-items"></div></section><section class="panel"><h2>当前交易</h2><div id="trade">—</div></section><section class="panel log-panel"><div class="log-head"><h2>运行日志</h2><button id="pause">暂停滚动</button></div><pre id="logs">—</pre></section></aside></section><footer>只读数据终端 · 不提供下单、撤单或改单功能 · <span id="source">terminal.json</span></footer></main><script src="workbench_v2.js"></script></body></html>
