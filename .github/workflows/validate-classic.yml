name: Validate Classic IBKR
on:
  push:
    branches: [main]
    paths:
      - "classic/**"
      - ".github/workflows/validate-classic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript
        run: node --check classic/app.js
      - name: Check classic assets
        run: |
          test -s classic/index.html
          test -s classic/style.css
          test -s classic/app.js
          grep -q 'id="private-data"' classic/index.html
          grep -q "IBKR_PLUGIN_IMPORT" classic/app.js
      - name: Ensure no public account JSON fetch
        run: |
          if grep -E "fetch\(['\"].*(snapshot\.json|trades\.json|nav-history\.json)" classic/app.js; then
            echo "Public private-account fetch is not permitted"
            exit 1
          fi
