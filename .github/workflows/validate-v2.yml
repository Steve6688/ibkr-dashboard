name: Validate Northstar V2
on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/validate-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check v2/app.js
      - name: Required assets and core references
        run: |
          test -s v2/index.html
          test -s v2/style.css
          test -s v2/app.js
          grep -q 'screen-home' v2/index.html
          grep -q 'snapshot.json' v2/app.js
          grep -q 'nav-history.json' v2/app.js
          grep -q 'trades.json' v2/app.js
      - name: Prohibit embedded credentials in V2
        run: |
          if grep -Ein '(flex_token|client_secret|api[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9_-]{12,}' v2/*.js v2/*.html; then
            echo 'Do not publish credentials in a public static dashboard'
            exit 1
          fi
